<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Naver Blog 모음</title>
  <style>
    :root { --bg:#0f172a; --card:#111827; --muted:#94a3b8; --text:#e5e7eb; --accent:#38bdf8; }
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,Apple Color Emoji,Segoe UI Emoji;}
    .wrap{max-width:900px;margin:40px auto;padding:16px;}
    .card{background:var(--card);border:1px solid #1f2937;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);}
    .head{padding:18px 20px;border-bottom:1px solid #1f2937;display:flex;gap:10px;align-items:center;justify-content:space-between}
    .title{font-weight:700;letter-spacing:.2px}
    .muted{color:var(--muted);font-size:13px}
    .body{padding:18px 20px;}
    textarea{width:100%;min-height:160px;background:#0b1220;color:var(--text);border:1px solid #1f2937;border-radius:10px;padding:12px 14px;resize:vertical;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
    button{appearance:none;border:1px solid #273043;background:#111827;color:var(--text);padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
    button:hover{border-color:var(--accent)}
    .primary{background:linear-gradient(180deg,#0ea5e9,#0284c7);border-color:#0369a1}
    .pill{display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border:1px dashed #334155;border-radius:999px;font-size:12px}
    .switch{display:inline-flex;align-items:center;gap:8px;margin-left:auto}
    input[type="checkbox"]{width:18px;height:18px}
    .status{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .stat{font-size:12px;border:1px solid #334155;padding:6px 10px;border-radius:8px;color:var(--muted)}
    .last a{color:#93c5fd;text-decoration:none}
    .last a:hover{text-decoration:underline}
    .footer{padding:14px 20px;border-top:1px solid #1f2937;display:flex;justify-content:space-between;align-items:center}
    .small{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div>
          <div class="title">🔹주제와 관련된 Blog들 입니다</div>
          <div class="muted"> keywords = ["재미있는 퇴직 후 이야기"]</div>
        </div>
        <label class="switch muted" title="중복 없이 모두 소진할 때까지">
          <input id="noRepeat" type="checkbox" checked>
          <span>중복 금지</span>
        </label>
      </div>
      <div class="body">
        <label class="muted" for="links">Naver Blog links </label>
        <textarea id="links" placeholder="https://example.com\nhttps://news.example.com/article\nhttps://youtu.be/dQw4w9WgXcQ"></textarea>

        <div class="row">
          <button class="primary" id="openNew">랜덤 열기 (새 탭)</button>
          <button id="openSelf">랜덤 이동 (현재 탭)</button>
          <button id="shuffleBtn" title="목록을 다시 섞고 초기화합니다.">재섞기/초기화</button>
          <span class="pill" id="countBadge">남은 항목: 0</span>
        </div>

        <div class="status">
          <div class="stat last" id="lastOpened">마지막 링크: (없음)</div>
          <div class="stat" id="errors">에러: 0</div>
        </div>
      </div>
      <div class="footer">
        <span class="small">Tip: http/https로 시작하지 않는 줄은 자동으로 무시합니다.</span>
        <span class="small">© Random Link Opener</span>
      </div>
    </div>
  </div>

  <script>
    // --- core state ---
    let pool = [];           // 남은 후보 (중복 금지 모드에서 사용)
    let allLinks = [];       // 전체 원본
    let errorCount = 0;

    const $ = (q) => document.querySelector(q);
    const textArea = $('#links');
    const noRepeat = $('#noRepeat');
    const countBadge = $('#countBadge');
    const lastOpened = $('#lastOpened');
    const errors = $('#errors');

    // 예시 데이터
    // 키워드표시 확인할것

 'https://blog.naver.com/alchun7medi/223998453808',
 'https://blog.naver.com/recordwithyo/223997968734']
      ;

    // 초기 세팅
    window.addEventListener('DOMContentLoaded', () => {
      if (!textArea.value.trim()) textArea.value = example.join('\n');
      rebuild();
    });

    // 유틸: 텍스트 영역 → 링크 배열
    function parseLinks() {
      const raw = textArea.value
        .split(/\s|,|\n|\r/)
        .map(s => s.trim())
        .filter(Boolean)
        .filter(s => /^https?:\/\//i.test(s));
      return Array.from(new Set(raw)); // 중복 제거
    }

    // 유틸: 배열 섞기 (Fisher-Yates)
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 풀 재구성
    function rebuild() {
      allLinks = parseLinks();
      pool = noRepeat.checked ? shuffle([...allLinks]) : [];
      updateCount();
    }

    // 남은 개수 갱신
    function updateCount() {
      const remain = noRepeat.checked ? pool.length : allLinks.length;
      countBadge.textContent = `남은 항목: ${remain}`;
    }

    // 랜덤 하나 가져오기
    function pickOne() {
      if (noRepeat.checked) {
        if (pool.length === 0) {
          // 소진됨 → 다시 섞을지 물어보기
          const again = confirm('모든 링크를 한 번씩 열었습니다. 다시 섞어서 반복할까요?');
          if (again) {
            pool = shuffle([...allLinks]);
          } else {
            return null;
          }
        }
        return pool.pop();
      } else {
        if (allLinks.length === 0) return null;
        const idx = Math.floor(Math.random() * allLinks.length);
        return allLinks[idx];
      }
    }

    // 열기
    function openRandom(target = '_blank') {
      const url = pickOne();
      if (!url) { updateCount(); return; }
      try {
        const win = window.open(url, target);
        if (!win && target === '_blank') {
          alert('팝업이 차단된 것 같습니다. 브라우저에서 이 사이트의 팝업을 허용해주세요.');
        }
        lastOpened.innerHTML = `마지막 링크: <a href="${url}" target="_blank" rel="noopener">${url}</a>`;
      } catch (e) {
        errorCount++;
        errors.textContent = `에러: ${errorCount}`;
        console.error(e);
      }
      updateCount();
    }

    // 이벤트 바인딩
    $('#openNew').addEventListener('click', () => openRandom('_blank'));
    $('#openSelf').addEventListener('click', () => openRandom('_self'));
    $('#shuffleBtn').addEventListener('click', rebuild);
    noRepeat.addEventListener('change', rebuild);
    textArea.addEventListener('input', rebuild);
  </script>

</html>
