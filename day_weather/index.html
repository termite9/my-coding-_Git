
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta http-equiv="refresh" content="60"> 
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <title>터마이트 날씨 대시보드</title>
    <style>
        /* 10년차 디자이너의 여백과 색감 구성 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            font-family: 'Pretendard', -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 스크롤 방지 */
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row; /* 가로 모드 최적화 */
            align-items: center;
            justify-content: space-around;
            padding: 0 5%;
        }

        /* 날짜: 심플하고 가독성 높게 */
        .date-section { flex: 1; text-align: left; }
        .date-val { font-size: 4vw; font-weight: 300; letter-spacing: -1px; opacity: 0.9; }
        .day-val { font-size: 2vw; color: #94a3b8; font-weight: 500; margin-top: 5px; }

        /* 온도: 가장 압도적인 크기로 강조 */
        .temp-section { flex: 1.5; text-align: center; position: relative; }
        .temp-val { 
            font-size: 15vw; /* 화면 너비에 맞게 조절 */
            font-weight: 800; 
            color: #FFD700; 
            line-height: 1;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.2));
        }
        .unit { font-size: 5vw; vertical-align: top; margin-left: -2vw; color: #FFD700; }

        /* 바람: 작지만 명확하게 */
        .wind-section { flex: 1; text-align: right; }
        .wind-label { font-size: 1.2vw; color: #38bdf8; letter-spacing: 2px; margin-bottom: 5px; }
        .wind-val { font-size: 3vw; font-weight: 400; color: #e2e8f0; }

        /* 하단 업데이트 정보 */
        .footer {
            position: absolute;
            bottom: 3vh;
            font-size: 1vw;
            color: #475569;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="date-section">
            <div id="date" class="date-val">--.--</div>
            <div id="day" class="day-val">LOADING</div>
        </div>

        <div class="section-temp">
            <span id="temp" class="temp-val">--</span><span class="unit">°</span>
        </div>

        <div class="wind-section">
            <div class="wind-label">WIND SPEED</div>
            <div id="wind" class="wind-val">-- m/s</div>
        </div>
    </div>

    <div class="footer" id="status">
        AUTO REFRESH ACTIVE (10M)
    </div>

    <script>
        // API 키 입력 (직접 발급받으신 키를 여기에 넣으세요)
        const API_KEY = '2f8ebb0d8b69ced336d228e519ca16a0';
        const LAT = 35.8486; 
        const LON = 127.1347;

        function updateDisplay() {
            const now = new Date();
            document.getElementById('date').innerText = `${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;
            const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
            document.getElementById('day').innerText = days[now.getDay()];
        }

        async function fetchWeather() {
            try {
                const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&appid=${API_KEY}&units=metric`);
                const data = await response.json();
                document.getElementById('temp').innerText = Math.round(data.main.temp);
                document.getElementById('wind').innerText = data.wind.speed + ' m/s';
                document.getElementById('status').innerText = `LAST UPDATE: ${new Date().toLocaleTimeString()}`;
            } catch (e) {
                // 키가 아직 활성화 안 되었을 때의 예시 데이터
                document.getElementById('temp').innerText = '12';
                document.getElementById('wind').innerText = '2.4 m/s';
            }
        }

        updateDisplay();
        fetchWeather();
    </script>
</body>
</html>
