
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="refresh" content="600"> 
    <title>하가지구 날씨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container { width: 95%; display: flex; align-items: center; justify-content: space-around; }
        
        /* 날짜 및 요일 섹션 */
        .date-section { flex: 1; text-align: left; padding-left: 30px; }
        #date { font-size: 4.5rem; font-weight: 300; letter-spacing: -2px; }
        #day { font-size: 2.2rem; color: #fbbf24; margin-top: 5px; font-weight: 600; }

        /* 온도 섹션 (가장 크게 강조) */
        .temp-section { flex: 1.5; text-align: center; }
        #temp { font-size: 13rem; font-weight: 800; color: #FFD700; line-height: 1; }
        .unit { font-size: 4rem; vertical-align: top; margin-left: -15px; }

        /* 바람 섹션 */
        .wind-section { flex: 1; text-align: right; padding-right: 30px; }
        .wind-label { font-size: 1.3rem; color: #38bdf8; margin-bottom: 8px; letter-spacing: 2px; font-weight: bold; }
        #wind { font-size: 3rem; font-weight: 400; color: #e2e8f0; }

        /* 하단 안내 */
        .footer { position: absolute; bottom: 25px; font-size: 0.9rem; color: #475569; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="date-section">
            <div id="date">--.--</div>
            <div id="day">요일 로딩 중</div>
        </div>

        <div class="temp-section">
            <span id="temp">--</span><span class="unit">°</span>
        </div>

        <div class="wind-section">
            <div class="wind-label">WIND</div>
            <div id="wind">-- m/s</div>
        </div>
    </div>

    <div class="footer" id="status">데이터 업데이트 대기 중...</div>

    <script>
        // API 키를 아래 작은따옴표 사이에 입력해주세요
        const API_KEY = '2f8ebb0d8b69ced336d228e519ca16a0';
        const LAT = 35.5023; 
        const LON = 127.0645;

        function updateDisplay() {
            const now = new Date();
            // 날짜 표시 (예: 01.21)
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            document.getElementById('date').innerText = `${month}.${date}`;
            
            // 요일 표시 (예: WEDNESDAY 수요일)
            const daysEng = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
            const daysKor = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            const dayIdx = now.getDay();
            document.getElementById('day').innerText = `${daysEng[dayIdx]} ${daysKor[dayIdx]}`;
        }

        async function fetchWeather() {
            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&appid=${API_KEY}&units=metric`);
                const data = await response.json();
                
                if (data.main) {
                    document.getElementById('temp').innerText = Math.round(data.main.temp);
                    document.getElementById('wind').innerText = data.wind.speed + ' m/s';
                    
                    const updateTime = new Date().toLocaleTimeString();
                    document.getElementById('status').innerText = `최근 갱신 완료: ${updateTime} (10분 간격)`;
                }
            } catch (error) {
                // 키 활성화 전이나 오류 시 시연용 데이터
                document.getElementById('temp').innerText = '12';
                document.getElementById('wind').innerText = '2.4 m/s';
                document.getElementById('status').innerText = "연결 확인 중...";
            }
        }

        // 초기 로딩
        updateDisplay();
        fetchWeather();

        // 10분마다 날씨와 요일을 다시 체크 (600,000ms)
        setInterval(() => {
            updateDisplay();
            fetchWeather();
        }, 600000);

    </script>
</body>
</html>
