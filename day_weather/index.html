
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="refresh" content="60"> 
    <title>터마이트 전주 날씨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container { width: 95%; display: flex; align-items: center; justify-content: space-around; }
        .date-section { flex: 1; text-align: left; padding-left: 20px; }
        #date { font-size: 4rem; font-weight: 300; }
        #time { font-size: 2rem; color: #fbbf24; margin-top: 5px; font-weight: bold; } /* 시간 표시 추가 */

        .temp-section { flex: 1.5; text-align: center; }
        #temp { font-size: 11rem; font-weight: 800; color: #FFD700; line-height: 1; }
        .unit { font-size: 4rem; vertical-align: top; }

        .wind-section { flex: 1; text-align: right; padding-right: 20px; }
        .wind-label { font-size: 1.2rem; color: #38bdf8; margin-bottom: 5px; }
        #wind { font-size: 2.5rem; }

        .footer { position: absolute; bottom: 20px; font-size: 0.8rem; color: #475569; }
    </style>
</head>
<body>

    <div class="container">
        <div class="date-section">
            <div id="date">--.--</div>
            <div id="time">00:00:00</div> </div>
        <div class="temp-section">
            <span id="temp">--</span><span class="unit">°</span>
        </div>
        <div class="wind-section">
            <div class="wind-label">WIND</div>
            <div id="wind">-- m/s</div>
        </div>
    </div>
    <div class="footer" id="status">1분마다 자동 갱신 중</div>

    <script>
        const API_KEY = '2f8ebb0d8b69ced336d228e519ca16a0';
        const LAT = 35.8486; 
        const LON = 127.1347;

        function updateDisplay() {
            const now = new Date();
            // 날짜 업데이트
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            document.getElementById('date').innerText = `${month}.${date}`;
            
            // 시간 업데이트 (초까지 표시해서 바뀌는지 바로 확인 가능)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').innerText = `${hours}:${minutes}:${seconds}`;
        }

        async function fetchWeather() {
            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&appid=${API_KEY}&units=metric`);
                const data = await response.json();
                if (data.main) {
                    document.getElementById('temp').innerText = Math.round(data.main.temp);
                    document.getElementById('wind').innerText = data.wind.speed + ' m/s';
                    document.getElementById('status').innerText = `최근 날씨 갱신: ${new Date().toLocaleTimeString()}`;
                }
            } catch (error) {
                // API 키가 아직 안될 때 표시할 기본값
                document.getElementById('temp').innerText = '12';
                document.getElementById('wind').innerText = '2.4';
                document.getElementById('status').innerText = "날씨 연결 대기 중...";
            }
        }

        // 즉시 실행
        updateDisplay();
        fetchWeather();

        // 1초마다 시간 업데이트 (초 시계가 가는 것을 보고 작동 확인)
        setInterval(updateDisplay, 1000);
        
        // 1분(60초)마다 날씨 새로고침은 상단의 <meta> 태그가 처리합니다.
    </script>
</body>
</html>
